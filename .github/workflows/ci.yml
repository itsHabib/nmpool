name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: python scripts/check.py
      - run: cargo run --locked -- --help
      - run: cargo build --release --locked
      - name: Work laptop smoke test
        run: python scripts/smoke.py --binary target/release/nmpool${{ runner.os == 'Windows' && '.exe' || '' }}
      - uses: actions/upload-artifact@v4
        with:
          name: nmpool-${{ runner.os }}-${{ runner.arch }}
          path: |
            target/release/nmpool
            target/release/nmpool.exe
          if-no-files-found: error
          retention-days: 14

  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked --all-targets --all-features

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      # No advisory ignores. Fail on vulnerabilities and informational warnings.
      - run: cargo audit --deny warnings
