name: mutants

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutants:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants
      # Preserve failure status; missed mutations are not silently accepted.
      - run: cargo mutants --locked --no-shuffle
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutants-out
          path: mutants.out/
          if-no-files-found: warn
          retention-days: 30
