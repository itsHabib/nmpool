[package]
name = "nmpool"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Verified private npm install reuse for macOS and Windows"
license = "MIT"
publish = false
repository = "https://github.com/itsHabib/nmpool"
readme = "README.md"
keywords = ["npm", "cache", "worktree"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
fs2 = "0.4"
dunce = "1"
same-file = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"

[lints.rust]
# Match Dossier/Rooms lint groups and selective restrictions. Native atomic
# publication is the only scoped unsafe exception. missing_docs is deferred
# until the experimental Rust API stabilizes, as in those projects.
unsafe_code = "deny"
unreachable_pub = "warn"
unused_lifetimes = "warn"
unused_qualifications = "warn"
non_ascii_idents = "warn"

[lints.clippy]
# Default groups: warn-everything, opt out individually below.
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }

# Selective restriction lints — the rest of restriction is too prescriptive.
# Cheney: don't panic, don't ignore errors, don't index-and-pray.
cognitive_complexity = "deny"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
indexing_slicing = "warn"
dbg_macro = "warn"
print_stdout = "warn"
str_to_string = "warn"
get_unwrap = "warn"
allow_attributes_without_reason = "warn"
undocumented_unsafe_blocks = "warn"

# Opt-outs from pedantic/nursery that fight idiom or aren't worth the noise.
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
multiple_crate_versions = "allow"
must_use_candidate = "allow"
similar_names = "allow"


[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
syn = { version = "2", features = ["full", "visit"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
